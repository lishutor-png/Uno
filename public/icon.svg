<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="55%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#021c12" />
    </radialGradient>
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="unoText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Rounded Square App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" stroke="url(#goldFrame)" stroke-width="14" />
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3" />

  <!-- Four-Color Stacked UNO Cards -->
  <g filter="url(#cardShadow)">
    <!-- Blue Card -->
    <g transform="translate(175 185) rotate(-24)">
      <rect x="-52" y="-76" width="104" height="152" rx="16" fill="#2563eb" stroke="#ffffff" stroke-width="6" />
      <ellipse cx="0" cy="0" rx="34" ry="50" transform="rotate(-14)" fill="#ffffff" fill-opacity="0.92" />
      <text x="0" y="14" text-anchor="middle" font-family="Outfit, Arial Black, sans-serif" font-weight="900" font-size="42" fill="#1d4ed8">+2</text>
    </g>

    <!-- Green Card -->
    <g transform="translate(222 168) rotate(-8)">
      <rect x="-52" y="-76" width="104" height="152" rx="16" fill="#16a34a" stroke="#ffffff" stroke-width="6" />
      <ellipse cx="0" cy="0" rx="34" ry="50" transform="rotate(-14)" fill="#ffffff" fill-opacity="0.92" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#15803d" stroke-width="7" />
      <line x1="-14" y1="14" x2="14" y2="-14" stroke="#15803d" stroke-width="7" />
    </g>

    <!-- Yellow Card -->
    <g transform="translate(285 168) rotate(9)">
      <rect x="-52" y="-76" width="104" height="152" rx="16" fill="#eab308" stroke="#ffffff" stroke-width="6" />
      <ellipse cx="0" cy="0" rx="34" ry="50" transform="rotate(-14)" fill="#ffffff" fill-opacity="0.92" />
      <text x="0" y="18" text-anchor="middle" font-family="Outfit, Arial Black, sans-serif" font-weight="900" font-size="54" fill="#b45309">7</text>
    </g>

    <!-- Red Front Card -->
    <g transform="translate(335 190) rotate(24)">
      <rect x="-52" y="-76" width="104" height="152" rx="16" fill="#dc2626" stroke="#ffffff" stroke-width="6" />
      <ellipse cx="0" cy="0" rx="34" ry="50" transform="rotate(-14)" fill="#ffffff" fill-opacity="0.95" />
      <text x="0" y="16" text-anchor="middle" font-family="Outfit, Arial Black, sans-serif" font-weight="900" font-size="44" fill="#dc2626">UNO</text>
    </g>
  </g>

  <!-- Embossed Center Emblem Banner -->
  <g transform="translate(256 355)" filter="url(#cardShadow)">
    <rect x="-175" y="-64" width="350" height="114" rx="28" fill="#991b1b" stroke="url(#goldFrame)" stroke-width="7" transform="rotate(-3)" />
    <text x="0" y="2" text-anchor="middle" font-family="Outfit, Arial Black, sans-serif" font-weight="900" font-size="76" letter-spacing="3" fill="url(#unoText)" stroke="#0f172a" stroke-width="11" paint-order="stroke" transform="rotate(-3)">UNO</text>
    <text x="0" y="42" text-anchor="middle" font-family="Outfit, Arial Black, sans-serif" font-weight="800" font-size="28" letter-spacing="10" fill="#fef08a" stroke="#0f172a" stroke-width="5" paint-order="stroke">ARENA</text>
  </g>
</svg>
